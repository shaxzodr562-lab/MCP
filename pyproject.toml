[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siat-mcp"
version = "0.1.0"
description = "MCP server and web assistant for official Uzbekistan statistics (siat.stat.uz)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "mcp>=2.3,<3", "python-dotenv>=1.0", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
siat-web = "siat_mcp.api:main"
siat-mcp = "siat_mcp.server:main"
siat-etl = "siat_mcp.etl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siat_mcp = ["schema.sql", "cumulative_overrides.csv"]
